; stunnel on the APP host - where rpms-rpc runs.
;
; rpms-rpc connects in plaintext to 127.0.0.1:9100 on this host; stunnel
; carries the bytes over mutual TLS to the stunnel in front of the broker.
; Point the client at the loopback end:
;   RpmsRpc::CiaClient.new(host: "127.0.0.1", port: 9100)
;
; Validated by test/rpms_rpc/stunnel_sample_test.rb, which runs this file with
; only the paths, ports and connect host replaced. See docs/tls.md.

[rpms-broker]
client = yes
; Loopback only: the plaintext end must not be reachable from the network.
accept = 127.0.0.1:9100
connect = rpms.example.internal:9443

; This host's client certificate (the RPMS side requires one).
cert = /etc/stunnel/app.crt
key = /etc/stunnel/app.key

; Trust only the CA that issued the RPMS side's certificate, and require the
; certificate to name the host we meant to reach.
CAfile = /etc/stunnel/rpms-ca.crt
verifyChain = yes
checkHost = rpms.example.internal
sslVersionMin = TLSv1.2
