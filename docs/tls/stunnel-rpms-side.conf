; stunnel on the RPMS side - on the broker host, or a host beside it on the
; broker's private network.
;
; Accepts mutual TLS on 9443 and hands the plaintext bytes to the broker. The
; broker port itself (9100 here) must stay closed to everything but this
; stunnel.
;
; Validated by test/rpms_rpc/stunnel_sample_test.rb, which runs this file with
; only the paths, ports and connect host replaced. See docs/tls.md.

[rpms-broker]
accept = 0.0.0.0:9443
; The broker port. Defaults are XWB 9100, BMX 9101, CIA 9200 (a YottaDB stack
; serves CIA on 9100). Add one section per broker port you use.
connect = 127.0.0.1:9100

; This side's certificate, issued to the name the app side checks.
cert = /etc/stunnel/rpms.crt
key = /etc/stunnel/rpms.key

; Require a client certificate issued by the app hosts' CA.
CAfile = /etc/stunnel/app-ca.crt
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.2
