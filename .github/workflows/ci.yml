name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          # rpc_tiers_test diffs data/rpc_tiers/grandfathered.yml against the
          # base branch; a shallow checkout has no base ref to diff against.
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # stunnel_sample_test.rb runs the docs/tls/ sample configs end to end;
      # it skips without stunnel, so install it here to keep it running.
      - name: Install stunnel
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stunnel4
      - name: Run tests
        # Every source file already says frozen_string_literal: true; the flag
        # makes a file that forgets it fail here rather than on a default flip (#47).
        env:
          RUBYOPT: --enable-frozen-string-literal
        run: bundle exec rake test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --no-server
