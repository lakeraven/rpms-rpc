# RPC tier rules — the curated judgement behind ADR 0004.
#
# Anything not named here defaults to tier M (model), disposition canonical.
# That default is deliberate: a new RPC is presumed to carry domain data until
# someone shows it carries presentation. Adding a name here is a design
# decision and belongs in review, not a mechanical edit.
#
#   view       -> tier V         disposition legacy      (presentation only)
#   dialog     -> tier C-dialog  disposition legacy      (remote-UI protocol)
#   control    -> tier C         disposition canonical   (domain invariants)
#   quarantine -> tier M/C       disposition quarantine  (adapter-only)
#
# Disqualifier tests: docs/adr/0004-frontend-agnostic-rpc-tiers.md section 3.
# Derived from: reference/traces/TraceLogExport.xml (15-Sep-2026).

