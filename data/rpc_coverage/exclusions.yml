# Reviewed exclusions from the rpc:coverage denominator (rpms-rpc#270, #278, #724): RPCs a person
# decided to leave out, each with one of these reasons and the evidence in the PR that added it:
#
#   gui_plumbing             drives a thick-client GUI (layout, window state); no headless use (ADR-0004 tiers)
#   write_needs_fixture      a write or side effect that needs a disposable fixture before it can run live
#
# These are contract: they hold on every release. The unreachable reasons (no_routine_on_image,
# no_entry_point_on_image, inactive_on_image, no_context, context_out_of_order) are NOT kept here:
# rpc:coverage computes them from the release under test's reach classes each run
# (RpcCoverage.exclusions_for; `rake rpc:exclusions` prints them). A reach-derived reason in this
# file fails the task, and so does an excluded RPC that answered live.
