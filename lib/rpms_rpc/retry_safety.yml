# Retry safety (rpms-rpc#110). The gem never retries. This table is advice
# a host consults before retrying a public API call on its own.
#
#   read                    every RPC the method may send is a pure read: no
#                           FileMan file or edit, lock, sign, audit or print
#                           log, sign-on or verify-code change, status update,
#                           or session context change. A method that sends no
#                           RPC is read only when the body itself has no side
#                           effect.
#   idempotent_write        a write the server dedupes. None are listed: no
#                           method proves a dedupe.
#   non_idempotent_write    a write, lock, sign, log, session change, sign-on,
#                           electronic-signature check, or a call whose effect
#                           the code does not establish. Binding a broker
#                           context option (ContextScope) is a session context
#                           change: restore is best-effort, so those methods
#                           are not auto-retry-safe even when the RPC they
#                           wrap only returns data.
#
# Only read is auto-retry-safe. A method with no entry is not.
